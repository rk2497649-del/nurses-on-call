<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nurse's On Call | Home Nursing Services Jaipur</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  background:#f4fbff;
  color:#333;
}

header{
  background:linear-gradient(135deg,#0077b6,#00b4d8);
  color:white;
  padding:25px 15px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

header p{
  font-size:16px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  margin:20px 0;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

h2{
  color:#0077b6;
  text-align:center;
}

.btn{
  display:block;
  text-align:center;
  background:#0077b6;
  color:white;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  margin-top:15px;
}

.service{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.service div{
  flex:1;
  min-width:200px;
  background:#e8f8ff;
  padding:15px;
  border-radius:15px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0 15px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:14px;
  background:#0077b6;
  color:white;
  border:none;
  border-radius:12px;
  font-size:17px;
}

footer{
  background:#023e8a;
  color:white;
  text-align:center;
  padding:15px;
}

.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#25d366;
  color:white;
  padding:15px;
  border-radius:50%;
  font-size:25px;
}
</style>

</head>

<body>

<header>
<div class="logo">👩‍⚕️ Nurse's On Call</div>
<p>Professional Home Nursing Services Jaipur</p>
</header>

<div class="container">
<!-- Services -->
<div class="card">
<h2>Our Services</h2>

<div class="service">
<div>🏥 Patient Care at Home</div>
<div>💉 Injection & Medicine Support</div>
<div>👵 Elderly Care Nursing</div>
<div>🚑 Emergency Nurse Visit</div>
</div>
</div>


<!-- Patient Booking -->
<div class="card">

<h2>Patient Nurse Booking</h2>

<form>

<label>Patient Name</label>
<input type="text" placeholder="Enter patient name">

<label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number">

<label>Address</label>
<textarea placeholder="Enter full address"></textarea>

<label>Patient Problem</label>
<textarea placeholder="Describe problem"></textarea>

<label>Select Date</label>
<input type="date">

<label>Select Time</label>
<input type="time">

<button>Book Nurse</button>

</form>

</div>


<!-- Nurse Registration -->
<div class="card">

<h2>Nurse Registration</h2>

<form>

<label>Nurse Name</label>
<input type="text" placeholder="Enter nurse name">

<label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number">

<label>Qualification</label>
<select>
<option>ANM</option>
<option>GNM</option>
<option>B.Sc Nursing</option>
<option>M.Sc Nursing</option>
</select>

<label>Experience</label>
<input type="text" placeholder="Experience years">

<label>Location</label>
<input type="text" placeholder="City/Area">

<button>Register Nurse</button>

</form>

</div>


<a class="btn" href="tel:+918949100258">
📞 Call Nurse Support
</a>

</div>


<a class="whatsapp" href="https://wa.me/918949100258">
💬
</a>


<footer>
<p>© 2026 Nurse's On Call | All Rights Reserved</p>
</footer>


</body>
</html>
